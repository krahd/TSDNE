name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Compile and render every shader family in real WebGL2
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser" || { echo "No Chrome/Chromium executable on runner"; exit 1; }
          python3 -m http.server 4173 --directory prototype >/tmp/tsdne-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:4173/diagnostics/compile/ >/dev/null && break
            sleep .2
          done
          "$browser" \
            --headless=new \
            --no-sandbox \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --virtual-time-budget=30000 \
            --dump-dom \
            http://127.0.0.1:4173/diagnostics/compile/ > /tmp/tsdne-compile.html
          cat /tmp/tsdne-compile.html
          # Assert on the attribute the script sets at the end of a successful
          # run, not on the marker text: the marker is a literal inside the
          # inline script, so --dump-dom echoes it back whether or not the page
          # ever finished, and grepping for it can never fail.
          grep -q 'data-tsdne-compile="pass"' /tmp/tsdne-compile.html
      - name: Produce the first encounter through the production runtime
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser" || { echo "No Chrome/Chromium executable on runner"; exit 1; }
          python3 -m http.server 4174 --directory prototype >/tmp/tsdne-runtime-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:4174/diagnostics/runtime/ >/dev/null && break
            sleep .2
          done
          "$browser" \
            --headless=new \
            --no-sandbox \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --virtual-time-budget=60000 \
            --dump-dom \
            http://127.0.0.1:4174/diagnostics/runtime/ > /tmp/tsdne-runtime.html
          cat /tmp/tsdne-runtime.html
          # Same reason as the compile step: assert on the attribute, which the
          # page source never contains literally. This step passed for several
          # commits while the page was in fact dumped still reading "running".
          grep -q 'data-tsdne-runtime="pass"' /tmp/tsdne-runtime.html
