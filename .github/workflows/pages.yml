name: Deploy artwork to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "prototype/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write deployed-build manifest
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("prototype/build.json", JSON.stringify({gitCommit:process.env.BUILD_SHA,deployedAt:new Date().toISOString()},null,2)+"\n")'
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artwork
        uses: actions/upload-pages-artifact@v4
        with:
          path: prototype
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
