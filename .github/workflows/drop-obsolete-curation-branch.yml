name: Drop obsolete curation branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drop-obsolete-curation-branch.yml"

permissions:
  contents: write

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Delete obsolete branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete research/curation-instrument-250
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TSDNE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/drop-obsolete-curation-branch.yml
          git commit -m "Remove obsolete curation branch cleanup workflow"
          git push origin main
