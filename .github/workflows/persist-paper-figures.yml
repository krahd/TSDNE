name: Persist validated paper figures

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/persist-paper-figures.yml"

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated exact-snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/tsdne-paper-figures paper-evidence/alpha5
          mkdir -p /tmp/tsdne-paper-figures paper-evidence/alpha5
          gh run download 32900932237 \
            --repo "$GITHUB_REPOSITORY" \
            --name tsdne-paper-figures-alpha5-v2 \
            --dir /tmp/tsdne-paper-figures
          cp -a /tmp/tsdne-paper-figures/. paper-evidence/alpha5/
          test -s paper-evidence/alpha5/figure-1-public-encounter.png
          test -s paper-evidence/alpha5/figure-2-visual-range.png
          test -s paper-evidence/alpha5/figure-2-metadata.json
          test "$(find paper-evidence/alpha5/figure-2-outputs -type f | wc -l)" -eq 9

      - name: Add immutable-evidence note
        run: |
          cat > paper-evidence/alpha5/EVIDENCE.md <<'EOF'
          # TSDNE alpha.5 paper figure evidence

          These files were generated by GitHub Actions run `32900932237` and visually preflighted for the TSDNE journal manuscript on 25 August 2026.

          **Documented artwork snapshot:** `6088c9103348815f9c055ff0fa83695b8b20abd9` (`0.3.1-alpha.5`).

          The capture workflow itself ran from later repository infrastructure but explicitly checked out the snapshot above before rendering. Figure 1 is the actual public artwork page from that checkout. Figure 2 and its metadata were produced in a single browser process by a temporary capture harness that invoked the snapshot's unchanged production runtime. The harness did not alter generator, selector, perception, history, provenance or rendering code.

          Figure 2 contains nine **sequential production encounters**. It is illustrative evidence of visual range, not statistical proof of global diversity.

          Do not silently replace these files with captures from a later runtime. If the manuscript changes its implementation snapshot, regenerate and re-audit the figures and metadata together.
          EOF

      - name: Commit evidence
        run: |
          set -euo pipefail
          git config user.name "Tomas Laurenzo"
          git config user.email "tomas@laurenzo.net"
          git add paper-evidence/alpha5
          if git diff --cached --quiet; then
            echo "Evidence already persisted"
            exit 0
          fi
          git commit -m "Persist TSDNE alpha.5 paper figure evidence"
          git push origin HEAD:main
