name: Materialize release candidate

on:
  push:
    branches: [main]
    paths:
      - ".release-payload/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize verified release candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .release-payload/chunk-* > /tmp/tsdne-release.b64
          base64 --decode /tmp/tsdne-release.b64 > /tmp/tsdne-release.tar.gz
          tar -xzf /tmp/tsdne-release.tar.gz -C .
          rm -rf .release-payload
          rm -f .github/workflows/materialize-release.yml
          git config user.name "TSDNE release bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement complete TSDNE release candidate"
          git push
