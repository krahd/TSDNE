name: Capture paper figures

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/paper-figures.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TSDNE_PAPER_SNAPSHOT: 6088c9103348815f9c055ff0fa83695b8b20abd9
      TSDNE_PAPER_VERSION: 0.3.1-alpha.5
    steps:
      # The workflow itself lives on current main, but every rendered pixel below
      # comes from the exact source snapshot cited by the manuscript.
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TSDNE_PAPER_SNAPSHOT }}

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser" || { echo "No Chrome/Chromium executable on runner"; exit 1; }
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          "$browser" --version

      - name: Write exact-snapshot capture harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prototype/diagnostics/paper paper-figures/figure-2-outputs
          cat > prototype/diagnostics/paper/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>TSDNE paper visual-range capture</title>
            <style>
              html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
              body{width:1800px;min-height:1400px;overflow:hidden}
              #hidden-runtime{position:fixed;left:-10000px;top:-10000px;width:768px;height:768px}
              #hidden-runtime canvas{position:absolute;width:768px;height:768px}
              #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px}
              .card{aspect-ratio:1/1;background:#111;overflow:hidden}
              .card img{display:block;width:100%;height:100%;object-fit:cover}
              #paper-payload{display:none}
              #status{position:fixed;right:20px;bottom:14px;padding:5px 8px;background:#000b;font-size:14px}
            </style>
          </head>
          <body>
            <div id="hidden-runtime">
              <canvas id="stage-a" width="768" height="768"></canvas>
              <canvas id="stage-b" width="768" height="768"></canvas>
            </div>
            <main id="grid" aria-label="Nine sequential TSDNE production encounters"></main>
            <textarea id="paper-payload" aria-hidden="true"></textarea>
            <div id="status">generating…</div>
            <script type="module" src="./capture.js"></script>
          </body>
          </html>
          HTML

          cat > prototype/diagnostics/paper/capture.js <<'JS'
          import { createTSDNERuntime } from "../../src/runtime.js";
          import { APP_VERSION } from "../../src/version.js";

          const SNAPSHOT = "6088c9103348815f9c055ff0fa83695b8b20abd9";
          const COUNT = 9;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const canvases = [document.querySelector("#stage-a"), document.querySelector("#stage-b")];
          const grid = document.querySelector("#grid");
          const payloadNode = document.querySelector("#paper-payload");
          const status = document.querySelector("#status");

          const runtime = await createTSDNERuntime({
            canvases,
            settings: { paused: false, reducedMotion: false, reducedIntensity: false },
          });

          const records = [];
          try {
            for (let index = 0; index < COUNT; index += 1) {
              status.textContent = `generating ${index + 1}/${COUNT}…`;
              if (index === 0) await runtime.start();
              else await runtime.another();
              // Let the transition settle and the selected shader advance to a
              // visible temporal state before taking an evidentiary still.
              await sleep(index === 0 ? 1200 : 1500);
              const encounter = runtime.currentEncounter();
              const image = runtime.captureThumbnail(768);
              if (!encounter || !image) throw new Error(`capture ${index + 1} failed`);
              const candidate = encounter.candidate;
              const record = {
                ordinal: index + 1,
                encounterNumber: encounter.encounterNumber,
                seed: candidate.seed ?? null,
                family: candidate.family ?? null,
                category: candidate.category ?? null,
                colorMode: candidate.colorMode ?? null,
                finish: candidate.finish ?? null,
                variant: candidate.variant ?? candidate.graph?.traits?.variant ?? null,
                generatorVersion: encounter.audit?.generatorVersion ?? candidate.graph?.generator ?? null,
                runtimeVersion: encounter.audit?.runtimeVersion ?? null,
                selectorVersion: encounter.audit?.selectorVersion ?? null,
                perceptionVersion: encounter.audit?.perceptionVersion ?? null,
                selectedRank: encounter.audit?.selectedRank ?? null,
                selectedScore: encounter.audit?.selectedScore ?? null,
                appVersion: APP_VERSION,
                implementationCommit: SNAPSHOT,
                shownAt: encounter.shownAt,
                imageDataURL: image,
              };
              records.push(record);
              const card = document.createElement("div");
              card.className = "card";
              const img = document.createElement("img");
              img.src = image;
              img.alt = `TSDNE generated output ${index + 1}`;
              card.append(img);
              grid.append(card);
            }
            payloadNode.value = JSON.stringify({
              implementationCommit: SNAPSHOT,
              appVersion: APP_VERSION,
              generatedAt: new Date().toISOString(),
              captures: records,
            });
            status.remove();
            document.documentElement.dataset.tsdnePaperFigures = "pass";
          } catch (error) {
            status.textContent = `FAILED: ${error instanceof Error ? error.message : String(error)}`;
            document.documentElement.dataset.tsdnePaperFigures = "fail";
            console.error(error);
          } finally {
            runtime.stop();
          }
          JS

      - name: Serve exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4175 --directory prototype >/tmp/tsdne-paper-http.log 2>&1 &
          echo $! > /tmp/tsdne-paper-server.pid
          for _ in {1..40}; do
            curl -fsS http://127.0.0.1:4175/ >/dev/null && exit 0
            sleep .25
          done
          cat /tmp/tsdne-paper-http.log
          exit 1

      - name: Capture Figure 1 from the actual public artwork
        shell: bash
        env:
          BROWSER: ${{ steps.chrome.outputs.browser }}
        run: |
          set -euo pipefail
          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --run-all-compositor-stages-before-draw \
            --hide-scrollbars \
            --window-size=1600,1000 \
            --virtual-time-budget=90000 \
            --screenshot=paper-figures/figure-1-public-encounter.png \
            http://127.0.0.1:4175/
          test -s paper-figures/figure-1-public-encounter.png
          cat > paper-figures/figure-1-metadata.json <<EOF
          {
            "implementationCommit": "$TSDNE_PAPER_SNAPSHOT",
            "appVersion": "$TSDNE_PAPER_VERSION",
            "captureKind": "actual public artwork runtime",
            "browser": "$($BROWSER --version | sed 's/"/\\"/g')",
            "runner": "GitHub Actions ubuntu-latest / SwiftShader",
            "note": "One generated encounter; no fixed hero image. Seed/family are not exposed by the public interface and are therefore not inferred."
          }
          EOF

      - name: Generate nine sequential production encounters for Figure 2
        shell: bash
        env:
          BROWSER: ${{ steps.chrome.outputs.browser }}
        run: |
          set -euo pipefail
          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --run-all-compositor-stages-before-draw \
            --hide-scrollbars \
            --window-size=1800,1400 \
            --virtual-time-budget=540000 \
            --dump-dom \
            http://127.0.0.1:4175/diagnostics/paper/ > /tmp/tsdne-paper-grid.html
          grep -q 'data-tsdne-paper-figures="pass"' /tmp/tsdne-paper-grid.html

          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --run-all-compositor-stages-before-draw \
            --hide-scrollbars \
            --window-size=1800,1400 \
            --virtual-time-budget=540000 \
            --screenshot=paper-figures/figure-2-visual-range.png \
            http://127.0.0.1:4175/diagnostics/paper/
          test -s paper-figures/figure-2-visual-range.png

          python3 - <<'PY'
          import base64, html, json, re
          from pathlib import Path

          dom = Path('/tmp/tsdne-paper-grid.html').read_text(encoding='utf-8')
          match = re.search(r'<textarea id="paper-payload"[^>]*>(.*?)</textarea>', dom, re.S)
          if not match:
              raise SystemExit('paper payload not found in dumped DOM')
          payload = json.loads(html.unescape(match.group(1)))
          out = Path('paper-figures/figure-2-outputs')
          out.mkdir(parents=True, exist_ok=True)
          clean = {k: v for k, v in payload.items() if k != 'captures'}
          clean['captures'] = []
          for record in payload['captures']:
              data = record.pop('imageDataURL')
              header, encoded = data.split(',', 1)
              ext = 'webp' if 'image/webp' in header else 'png'
              path = out / f"{record['ordinal']:02d}.{ext}"
              path.write_bytes(base64.b64decode(encoded))
              record['file'] = str(path)
              clean['captures'].append(record)
          Path('paper-figures/figure-2-metadata.json').write_text(json.dumps(clean, indent=2) + '\n', encoding='utf-8')
          PY
          test "$(find paper-figures/figure-2-outputs -type f | wc -l)" -eq 9

      - name: Record provenance
        shell: bash
        env:
          BROWSER: ${{ steps.chrome.outputs.browser }}
        run: |
          set -euo pipefail
          cat > paper-figures/README.txt <<EOF
          TSDNE paper-figure capture artifact

          Exact implementation snapshot:
          $TSDNE_PAPER_SNAPSHOT ($TSDNE_PAPER_VERSION)

          Figure 1 is a screenshot of the actual public artwork page served from
          that checkout. Figure 2 is produced by a temporary, uncommitted capture
          harness that imports and calls the exact snapshot's production runtime;
          the harness does not modify generator, selector, perception, history,
          provenance or rendering code. Each Figure 2 output has a metadata entry.

          Browser:
          $($BROWSER --version)

          The figures remain subject to human visual/artistic selection and
          publication-layout preflight. The nine-output plate demonstrates nine
          sequential production encounters; it is not statistical evidence of
          global visual diversity.
          EOF

      - name: Stop server
        if: always()
        shell: bash
        run: |
          test -f /tmp/tsdne-paper-server.pid && kill "$(cat /tmp/tsdne-paper-server.pid)" 2>/dev/null || true

      - name: Upload paper-figure evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsdne-paper-figures-alpha5
          path: paper-figures/
          if-no-files-found: error
          retention-days: 30
