name: Materialise curation revision

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialise-curation-revision.yml"

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct and verify revision
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .curation-revision.payload.b64 \
            .curation-revision.payload.part01 \
            .curation-revision.payload.part02 \
            .curation-revision.payload.part03 \
            .curation-revision.payload.part04 \
            > /tmp/tsdne-curation-revision.b64
          test "$(wc -c < /tmp/tsdne-curation-revision.b64)" -eq 32080
          base64 -d /tmp/tsdne-curation-revision.b64 > /tmp/tsdne-curation-revision.tgz
          echo "bf920f2f79f7400553c1aaa6f3a49dd940ba5c033ca62ec9346e2f6848f3ea86  /tmp/tsdne-curation-revision.tgz" | sha256sum -c -
          tar -xzf /tmp/tsdne-curation-revision.tgz -C .

      - name: Verify implementation before commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run verify
          grep -q 'from "./runtime.js"' prototype/src/curation.js
          ! grep -Eq 'from "\./(generator|synthesis|perception|history|webgl|provenance)\.js"' prototype/src/curation.js
          ! grep -Eq 'from "\./(generator|synthesis|perception|history|webgl|provenance)\.js"' prototype/src/main.js
          ! grep -R -n 'curation' prototype/index.html
          grep -q 'noindex,nofollow,noarchive' prototype/curation/index.html
          grep -q 'F.*OK' prototype/curation/index.html
          grep -q 'G.*not OK' prototype/curation/index.html
          grep -q 'H.*repetitive' prototype/curation/index.html

      - name: Commit verified revision and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .curation-revision.payload.b64 \
            .curation-revision.payload.part01 \
            .curation-revision.payload.part02 \
            .curation-revision.payload.part03 \
            .curation-revision.payload.part04 \
            .github/workflows/materialise-curation-revision.yml
          git config user.name "TSDNE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement external production curation audit"
          git push origin main
