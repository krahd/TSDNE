<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#000000">
  <title>TSDNE curation</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./curation.css">
</head>
<body>
  <main class="stage" aria-label="TSDNE curation audit">
    <canvas id="stage-a" class="shader-layer active" aria-label="Generated shader under review" aria-hidden="false"></canvas>
    <canvas id="stage-b" class="shader-layer" aria-hidden="true"></canvas>
  </main>

  <div class="curation-overlay" aria-label="Curation controls">
    <span><kbd>F</kbd> OK</span>
    <span><kbd>G</kbd> not OK</span>
    <span><kbd>H</kbd> repetitive</span>
    <span><kbd>C</kbd> comment</span>
    <span><kbd>E</kbd> export</span>
    <span id="curation-count">0 rated</span>
  </div>
  <div id="curation-status" class="curation-status" role="status" aria-live="polite" hidden></div>

  <dialog id="comment-panel">
    <form method="dialog" class="comment-shell">
      <p id="comment-hint"></p>
      <label for="comment-input">Optional comment</label>
      <textarea id="comment-input" rows="4" spellcheck="true"></textarea>
      <div class="comment-actions">
        <button id="comment-cancel" value="cancel">cancel</button>
        <button id="comment-save" value="default">save comment</button>
      </div>
      <p class="hint"><kbd>Cmd/Ctrl</kbd> + <kbd>Enter</kbd> saves</p>
    </form>
  </dialog>

  <noscript><p class="noscript">This audit requires JavaScript and WebGL2.</p></noscript>
  <script type="module" src="../src/curation.js"></script>
</body>
</html>
