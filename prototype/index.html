<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="This Shader Does Not Exist is a browser artwork about exploration, ephemerality, freely circulating code, and local generative AI without profiling.">
  <meta property="og:title" content="This Shader Does Not Exist">
  <meta property="og:description" content="One shader at a time. Keep it, relinquish it, or let its freely reusable code continue elsewhere.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./assets/social-preview.svg">
  <meta name="twitter:card" content="summary_large_image">
  <title>This Shader Does Not Exist</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#controls">Skip to controls</a>
  <main class="stage" aria-label="This Shader Does Not Exist">
    <canvas id="stage-a" class="shader-layer active" aria-label="A full-screen generative shader" aria-hidden="false"></canvas>
    <canvas id="stage-b" class="shader-layer" aria-hidden="true"></canvas>
  </main>
  <button id="ai-state" class="ai-state" type="button" data-state="idle" aria-label="Procedural generation">procedural</button>
  <nav id="controls" class="controls" aria-label="Artwork controls">
    <button id="another" type="button">another</button>
    <button id="use" type="button">use this shader</button>
    <button id="pause" type="button" aria-pressed="false">pause</button>
    <button id="about" type="button">about</button>
  </nav>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <noscript><p class="noscript">This artwork requires JavaScript and WebGL2.</p></noscript>
  <dialog id="panel" aria-labelledby="panel-title">
    <form method="dialog" class="panel-shell">
      <header><h1 id="panel-title">This Shader Does Not Exist</h1><button class="close" value="close" aria-label="Close dialog">×</button></header>
      <div id="panel-content"></div>
    </form>
  </dialog>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
