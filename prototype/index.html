<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="This Shader Does Not Exist is a browser artwork about exploration, ephemerality, freely circulating code, and local generative AI without profiling.">
  <title>This Shader Does Not Exist — alpha prototype</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stage" aria-label="This Shader Does Not Exist">
    <canvas id="stage-a" class="shader-layer active" aria-label="A full-screen generative shader"></canvas>
    <canvas id="stage-b" class="shader-layer" aria-hidden="true"></canvas>
  </main>

  <button id="ai-state" class="ai-state" type="button" data-state="idle" aria-label="Procedural generation">procedural</button>

  <nav class="controls" aria-label="Artwork controls">
    <button id="another" type="button">another</button>
    <button id="use" type="button">use this shader</button>
    <button id="about" type="button">about</button>
  </nav>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <dialog id="panel">
    <form method="dialog" class="panel-shell">
      <header>
        <h1 id="panel-title">Use this shader</h1>
        <button class="close" value="close" aria-label="Close">×</button>
      </header>
      <div id="panel-content"></div>
    </form>
  </dialog>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
