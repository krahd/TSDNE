<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A singular computational encounter without profiling, proprietary title, or behavioural recommendation.">
  <meta property="og:title" content="This Shader Does Not Exist">
  <meta property="og:description" content="One shader at a time. Remain, relinquish it, or take the code.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./assets/social-preview.svg">
  <meta name="twitter:card" content="summary_large_image">
  <title>This Shader Does Not Exist</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#controls">Skip to controls</a>
  <main class="stage" aria-label="This Shader Does Not Exist">
    <canvas id="stage-a" class="shader-layer active" aria-label="A full-screen generated shader" aria-hidden="false"></canvas>
    <canvas id="stage-b" class="shader-layer" aria-hidden="true"></canvas>
  </main>
  <nav id="controls" class="controls" aria-label="Artwork controls">
    <button id="another" type="button">another</button>
    <button id="use" type="button">take the code</button>
    <button id="pause" type="button" aria-pressed="false">pause</button>
    <button id="about" type="button">about</button>
  </nav>
  <div id="status" class="status" role="status" aria-live="polite" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span id="status-text"></span>
    <span id="status-count" class="status-count" aria-hidden="true"></span>
  </div>
  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <noscript><p class="noscript">This artwork requires JavaScript and WebGL2.</p></noscript>
  <dialog id="panel" aria-labelledby="panel-title">
    <form method="dialog" class="panel-shell">
      <header><h1 id="panel-title">This Shader Does Not Exist</h1><button class="close" value="close" aria-label="Close dialog">×</button></header>
      <div id="panel-content"></div>
      <footer class="panel-footer">
        <p class="panel-credit">TSDNE is a project by <a href="https://laurenzo.net/">Tomas Laurenzo</a>.</p>
        <p class="panel-version" id="panel-version"></p>
      </footer>
    </form>
  </dialog>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
